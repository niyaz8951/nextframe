<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1024">
  <title>The Next Frame</title>
  <meta name="description" content="One shared universe that never resets. Reality doesn't exist until something interacts with it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1024'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ece9f7' stroke-width='1.6' stroke-dasharray='2 3'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23f3c969'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Arrival: sign in or begin a life -->
  <main id="gate" class="gate" hidden>
    <div class="gate-inner">
      <h1 class="wordmark">The Next Frame</h1>
      <p class="voice">Reality doesn’t exist until something interacts with it.</p>
      <form id="auth" class="auth" autocomplete="on">
        <div class="seg" role="tablist">
          <button type="button" role="tab" data-mode="register" aria-selected="true">Begin a life</button>
          <button type="button" role="tab" data-mode="login" aria-selected="false">Return</button>
        </div>
        <label data-only="register">Observer name<input name="username" autocomplete="username" maxlength="20" spellcheck="false"></label>
        <label><span id="emailLabel">Email</span><input name="email" autocomplete="email" maxlength="200" spellcheck="false"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="200"></label>
        <p id="authError" class="error" role="alert"></p>
        <button class="primary" id="authGo">Enter the universe</button>
        <p class="fine" data-only="register">One universe, shared by everyone. One life in it. Nothing you do can be undone, and it never resets.</p>
      </form>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <header class="top">
      <div><div class="wordmark small">The Next Frame</div><div class="era" id="uEra"></div></div>
      <dl class="cosmos">
        <div><dt>Universe age</dt><dd><span id="uTick">–</span> <small>ticks</small></dd></div>
        <div><dt>Entropy</dt><dd id="uEntropy">–</dd></div>
        <div><dt>Total energy</dt><dd id="uEnergy">–</dd></div>
      </dl>
    </header>

    <section id="view-universe" class="view universe">
      <div class="mapwrap">
        <svg id="map" class="map" role="application" aria-label="Map of the universe you have explored" touch-action="none">
          <defs>
            <radialGradient id="g-star"><stop offset="0" stop-color="#fff6d6"/><stop offset=".25" stop-color="#f3c969"/><stop offset="1" stop-color="#f3c969" stop-opacity="0"/></radialGradient>
            <radialGradient id="g-dust"><stop offset="0" stop-color="#c69cf0" stop-opacity=".5"/><stop offset="1" stop-color="#c69cf0" stop-opacity="0"/></radialGradient>
            <radialGradient id="g-field"><stop offset="0" stop-color="#7cc6d6" stop-opacity=".35"/><stop offset="1" stop-color="#7cc6d6" stop-opacity="0"/></radialGradient>
            <pattern id="p-unstable" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="8" stroke="#f08a7b" stroke-opacity=".16" stroke-width="2"/></pattern>
          </defs>
          <g id="L-regions"></g><g id="L-links"></g><g id="L-objects"></g><g id="L-fx"></g>
        </svg>
        <div class="mapbtns">
          <button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="recenter" aria-label="Go to where you are">◎</button>
        </div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
      </div>
      <aside id="sheet" class="sheet" aria-live="polite"></aside>
    </section>

    <section id="view-discover" class="view page" hidden></section>
    <section id="view-history" class="view page" hidden></section>
    <section id="view-profile" class="view page" hidden></section>

    <footer class="dock">
      <dl class="self">
        <div><dt>Energy</dt><dd id="meEnergy">–</dd></div>
        <div><dt>Knowledge</dt><dd id="meKnowledge">–</dd></div>
        <div><dt>Influence</dt><dd id="meInfluence">–</dd></div>
        <div class="rank"><dt>You are</dt><dd id="meRank">–</dd></div>
      </dl>
      <nav class="tabs" aria-label="Sections">
        <button data-tab="universe" aria-current="page">Universe</button>
        <button data-tab="discover">Discover</button>
        <button data-tab="history">History</button>
        <button data-tab="profile">Profile</button>
      </nav>
    </footer>
  </div>

  <div id="veil" class="veil" hidden></div>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
