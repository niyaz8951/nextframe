# Optional. Publishes the game's frontend (the public/ folder) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# GitHub Pages only serves files. The shared universe (API + database) must run
# elsewhere - see "Putting it on GitHub" in the README - and public/config.js must point to it.
name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:   # run by hand from the Actions tab; add a push trigger once Pages is set up
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
