# docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: frame, POSTGRES_PASSWORD: frame, POSTGRES_DB: nextframe }
    volumes: [universe:/var/lib/postgresql/data]   # the memory of the universe. Do not delete this volume.
  app:
    build: .
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://frame:frame@db:5432/nextframe
      JWT_SECRET: change-me-to-a-long-random-string
volumes:
  universe:
